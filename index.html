<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<title>SearchTides - OM PERFORMANCE DASHBOARD</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #f5f4f0;
  --surface:  #ffffff;
  --surface2: #f9f8f5;
  --surface3: #eeecea;
  --border:   rgba(0,0,0,0.08);
  --border2:  rgba(0,0,0,0.14);
  --text:     #1a1916;
  --muted:    #888580;
  --muted2:   #5a5754;
  --purple:       #5b4de0;
  --purple-light: #7c6af5;
  --teal:       #0e9e80;
  --teal-light: #12b894;
  --amber:      #c47a1a;
  --red:    #c0392b;
  --orange: #e07820;
  --green:  #1a8a52;
  --fd: 'Libre Baskerville', serif;
  --fs: 'Inter', sans-serif;
  --fm: 'DM Mono', monospace;
}
body { 
  font-family: var(--fs); 
  background: var(--bg); 
  color: var(--text); 
  min-height: 100vh; 
  font-variant-numeric: tabular-nums; 
  font-size: 14px; 
}

/* LOADING */
#loading-screen { 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  justify-content: center; 
  min-height: 100vh; 
  gap: 1.5rem; 
}
.load-wordmark { 
  font-family: var(--fd); 
  font-size: 12px; 
  font-weight: 400; 
  letter-spacing: 0.2em; 
  text-transform: uppercase; 
  color: var(--muted); 
  display: flex; 
  align-items: center; 
  gap: 12px; 
}
.load-wordmark::before, .load-wordmark::after { 
  content: ''; 
  display: block; 
  width: 32px; 
  height: 1px; 
  background: var(--border2); 
}
.load-title { 
  font-family: var(--fd); 
  font-size: 52px; 
  font-weight: 700; 
  letter-spacing: 0.04em; 
  text-transform: uppercase; 
}
.load-title em { 
  font-style: italic; 
  color: var(--purple); 
  font-weight: 400; 
}
.load-status { 
  font-size: 12px; 
  color: var(--muted); 
  font-family: var(--fm); 
  display: flex; 
  align-items: center; 
  gap: 8px; 
}
.spinner { 
  width: 14px; 
  height: 14px; 
  border: 2px solid var(--border2); 
  border-top-color: var(--purple); 
  border-radius: 50%; 
  animation: spin 0.7s linear infinite; 
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { 
  background: var(--surface); 
  border: 1px solid rgba(192,57,43,0.3); 
  border-radius: 8px; 
  padding: 1.5rem 2rem; 
  max-width: 480px; 
  text-align: center; 
}
.error-box h3 { 
  font-family: var(--fd); 
  font-size: 18px; 
  color: var(--red); 
  margin-bottom: 0.5rem; 
}
.error-box p { 
  font-size: 13px; 
  color: var(--muted2); 
  font-family: var(--fm); 
  margin-bottom: 1rem; 
}
.retry-btn { 
  padding: 8px 20px; 
  background: var(--purple); 
  color: #fff; 
  border: none; 
  border-radius: 4px; 
  font-size: 12px; 
  font-weight: 600; 
  font-family: var(--fs); 
  cursor: pointer; 
  letter-spacing: 0.06em; 
  text-transform: uppercase; 
}

/* DASHBOARD */
#dashboard { 
  display: none; 
  max-width: 1800px; 
  margin: 0 auto; 
  padding: 0 2rem 4rem; 
}
.topnav { 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  padding: 1.1rem 0; 
  border-bottom: 1px solid var(--border2); 
  flex-wrap: wrap; 
  gap: 1rem; 
}
.nav-brand { 
  font-family: var(--fd); 
  font-size: 17px; 
  font-weight: 700; 
  display: flex; 
  align-items: center; 
  gap: 10px; 
}
.nav-dot { 
  width: 7px; 
  height: 7px; 
  border-radius: 50%; 
  background: var(--purple); 
}
.nav-brand span { 
  color: var(--muted); 
  font-weight: 400; 
  font-size: 14px; 
  font-family: var(--fs); 
}
.nav-right { 
  display: flex; 
  align-items: center; 
  gap: 1rem; 
  flex-wrap: wrap; 
}
.nav-meta { 
  font-size: 11px; 
  color: var(--muted); 
  font-family: var(--fm); 
}
.refresh-btn { 
  font-size: 11px; 
  color: var(--muted2); 
  background: var(--surface); 
  border: 1px solid var(--border2); 
  border-radius: 4px; 
  padding: 6px 14px; 
  cursor: pointer; 
  font-family: var(--fm); 
  display: flex; 
  align-items: center; 
  gap: 6px; 
  transition: border-color 0.15s, color 0.15s; 
}
.refresh-btn:hover { 
  border-color: var(--purple); 
  color: var(--purple); 
}
.refresh-btn .spin-sm { 
  width: 10px; 
  height: 10px; 
  border: 1.5px solid var(--border2); 
  border-top-color: var(--purple); 
  border-radius: 50%; 
  animation: spin 0.7s linear infinite; 
  display: none; 
}
.refresh-btn.loading .spin-sm { display: block; }

.tabs { 
  display: flex; 
  border-bottom: 1px solid var(--border2); 
  margin-bottom: 1.75rem; 
  margin-top: 1.5rem;
  gap: 8px;
}
.tab { 
  padding: 13px 22px; 
  font-size: 11px; 
  font-weight: 600; 
  letter-spacing: 0.09em; 
  text-transform: uppercase; 
  font-family: var(--fm); 
  color: var(--muted); 
  cursor: pointer; 
  border-bottom: 2px solid transparent; 
  margin-bottom: -1px; 
  transition: color 0.15s, border-color 0.15s; 
}
.tab:hover { color: var(--muted2); }
.tab.active { 
  color: var(--purple); 
  border-bottom-color: var(--purple); 
}
.tab-content { display: none; }
.tab-content.active { display: block; }

.section-title {
  font-family: var(--fd);
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 1.5rem;
  margin-top: 2rem;
  letter-spacing: -0.01em;
}

.section-title:first-child { margin-top: 0; }

.data-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 1.5rem;
  margin-bottom: 2rem;
}

.card-header {
  font-family: var(--fd);
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
}

/* Tables */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  font-family: var(--fm);
}

.data-table thead {
  background: var(--surface3);
}

.data-table th {
  padding: 10px 12px;
  text-align: center;
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted2);
  border-bottom: 1px solid var(--border2);
}

.data-table th:first-child {
  text-align: left;
}

.data-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: center;
}

.data-table td:first-child {
  text-align: left;
}

.data-table tbody tr:hover {
  background: var(--surface2);
}

.data-table td.num {
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.data-table td.om-name {
  font-weight: 500;
  color: var(--text);
  text-align: left;
}

/* Highlighted status rows */
.status-row-published {
  background: rgba(14, 158, 128, 0.08);
}

.status-row-pending {
  background: rgba(91, 77, 224, 0.06);
}

.status-row-content-requested {
  background: rgba(196, 122, 26, 0.08);
}

.status-row-ready {
  background: rgba(26, 138, 82, 0.08);
}

.status-row-revisions {
  background: rgba(224, 120, 32, 0.08);
}

.status-row-approved {
  background: rgba(91, 77, 224, 0.1);
}

.status-row-published:hover,
.status-row-pending:hover,
.status-row-content-requested:hover,
.status-row-ready:hover,
.status-row-revisions:hover,
.status-row-approved:hover {
  background: var(--surface2);
}

/* Charts */
.chart-container {
  position: relative;
  height: 400px;
  margin-bottom: 2rem;
}

.chart-small {
  height: 300px;
}

.toggle-group {
  display: flex;
  gap: 8px;
  margin-bottom: 1.5rem;
  justify-content: center;
}

.toggle-btn {
  padding: 8px 16px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--fm);
  color: var(--muted2);
  cursor: pointer;
  transition: all 0.15s;
}

.toggle-btn:hover {
  border-color: var(--purple);
  color: var(--purple);
}

.toggle-btn.active {
  background: var(--purple);
  border-color: var(--purple);
  color: #fff;
}

/* Sub-tabs for individual OM view */
.sub-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 2rem;
  padding: 10px;
  background: var(--surface3);
  border-radius: 10px;
}
.sub-tab {
  padding: 10px 18px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--fm);
  letter-spacing: 0.05em;
  color: var(--muted2);
  cursor: pointer;
  transition: all 0.15s;
}
.sub-tab:hover {
  color: var(--purple);
  background: var(--surface);
}
.sub-tab.active {
  background: var(--purple);
  color: #fff;
  border-color: var(--purple);
}

/* KPI cards for OM detail */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 1.25rem;
}
.kpi-card.accent-purple { border-top: 3px solid var(--purple); }
.kpi-card.accent-teal { border-top: 3px solid var(--teal); }
.kpi-card.accent-amber { border-top: 3px solid var(--amber); }
.kpi-card.accent-green { border-top: 3px solid var(--green); }
.kpi-card.accent-orange { border-top: 3px solid var(--orange); }
.kpi-card.accent-red { border-top: 3px solid var(--red); }
.kpi-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  font-family: var(--fm);
  margin-bottom: 0.5rem;
}
.kpi-value {
  font-family: var(--fd);
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.1;
}
.kpi-sub {
  font-size: 11px;
  color: var(--muted2);
  font-family: var(--fm);
  margin-top: 0.35rem;
}
.kpi-sub strong {
  color: var(--purple);
  font-weight: 600;
}

.kpi-trend {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-family: var(--fm);
  font-weight: 600;
  margin-top: 0.5rem;
  padding: 3px 8px;
  border-radius: 20px;
}
.kpi-trend.up-good   { background: rgba(26,138,82,0.12);  color: #1a8a52; }
.kpi-trend.up-bad    { background: rgba(192,57,43,0.12);  color: #c0392b; }
.kpi-trend.down-good { background: rgba(26,138,82,0.12);  color: #1a8a52; }
.kpi-trend.down-bad  { background: rgba(192,57,43,0.12);  color: #c0392b; }
.kpi-trend.neutral   { background: rgba(136,133,128,0.12); color: var(--muted2); }
.kpi-trend-label {
  font-size: 10px;
  font-weight: 400;
  font-family: var(--fm);
  color: var(--muted);
  margin-top: 2px;
}

.om-header {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border2);
}
.om-header h2 {
  font-family: var(--fd);
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.om-header .om-meta {
  font-family: var(--fm);
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.05em;
}

@media (max-width: 900px) {
  #dashboard { padding: 0 1rem 2rem; }
  .section-title { font-size: 20px; }
  .chart-container { height: 300px; }
  .data-table { font-size: 11px; }
  .data-table th, .data-table td { padding: 8px 10px; }
}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="load-wordmark">SearchTides</div>
  <h1 class="load-title">OM <em>PERFORMANCE</em></h1>
  <div class="load-status" id="load-status">
    <div class="spinner"></div>
    <span id="load-text">Loading data...</span>
  </div>
</div>

<div id="dashboard">
  <div class="topnav">
    <div class="nav-brand">
      <div class="nav-dot"></div>
      SearchTides
      <span>/ OM PERFORMANCE DASHBOARD</span>
    </div>
    <div class="nav-right">
      <span class="nav-meta" id="nav-meta"></span>
      <button class="refresh-btn" id="refresh-btn" onclick="loadData()">
        <div class="spin-sm"></div>
        Refresh
      </button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('statuses')">Statuses</div>
    <div class="tab" onclick="switchTab('quota')">Built Quota from Previous Month</div>
    <div class="tab" onclick="switchTab('trends')">Trends</div>
    <div class="tab" onclick="switchTab('om-detail')">OM Detail (1:1)</div>
    <div class="tab" onclick="switchTab('superfeeders')">Superfeeders</div>
    <div class="tab" onclick="switchTab('super-om-detail')">Superfeeders OM Detail (1:1)</div>
  </div>

  <div class="tab-content active" id="tab-statuses">
    <div id="statuses-content"></div>
  </div>

  <div class="tab-content" id="tab-quota">
    <div id="quota-content"></div>
  </div>

  <div class="tab-content" id="tab-trends">
    <div class="toggle-group">
      <button class="toggle-btn" onclick="setTrendPeriod(6)">6 Months</button>
      <button class="toggle-btn active" onclick="setTrendPeriod(12)">12 Months</button>
    </div>
    <div id="trends-content"></div>
  </div>

  <div class="tab-content" id="tab-om-detail">
    <div class="sub-tabs" id="om-detail-subtabs"></div>
    <div id="om-detail-content"></div>
  </div>

  <div class="tab-content" id="tab-superfeeders">
    <h2 class="section-title">Superfeeders - Statuses</h2>
    <div id="super-statuses-content"></div>
    
    <h2 class="section-title">Superfeeders - Built Quota from Previous Month</h2>
    <div id="super-quota-content"></div>
    
    <h2 class="section-title">Superfeeders - Trends</h2>
    <div class="toggle-group">
      <button class="toggle-btn" onclick="setSuperTrendPeriod(6)">6 Months</button>
      <button class="toggle-btn active" onclick="setSuperTrendPeriod(12)">12 Months</button>
    </div>
    <div id="super-trends-content"></div>
  </div>

  <div class="tab-content" id="tab-super-om-detail">
    <div class="sub-tabs" id="super-om-detail-subtabs"></div>
    <div id="super-om-detail-content"></div>
  </div>
</div>

<script>
let globalData = null;
let trendPeriod = 12;
let superTrendPeriod = 12;
let charts = {};
let omDetailState = {
  hss: { selectedOm: null, period: 12 },
  super: { selectedOm: null, period: 12 }
};

const CHART_COLORS = [
  '#5b4de0', // Fialová (Purple)
  '#0e9e80', // Teal
  '#e63946', // Červená (Red)
  '#f77f00', // Oranžová (Orange)
  '#06d6a0', // Zelená (Mint Green)
  '#118ab2', // Modrá (Blue)
  '#ef476f', // Růžová (Pink)
  '#ffd60a'  // Žlutá (Yellow) - pro případné další OM
];

function fmt(v) { return Math.round(v||0).toLocaleString("en-US"); }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function switchTab(tab) {
  const tabs = ['statuses', 'quota', 'trends', 'om-detail', 'superfeeders', 'super-om-detail'];
  document.querySelectorAll(".tabs > .tab").forEach((t, i) => {
    t.classList.toggle("active", tabs[i] === tab);
  });
  tabs.forEach(t => {
    document.getElementById("tab-" + t).classList.toggle("active", t === tab);
  });
}

function setTrendPeriod(months) {
  trendPeriod = months;
  document.querySelectorAll("#tab-trends .toggle-btn").forEach((btn, i) => {
    btn.classList.toggle("active", (i === 0 && months === 6) || (i === 1 && months === 12));
  });
  if (globalData) renderTrends(globalData.hss, 'trends-content');
}

function setSuperTrendPeriod(months) {
  superTrendPeriod = months;
  document.querySelectorAll("#tab-superfeeders .toggle-group .toggle-btn").forEach((btn, i) => {
    btn.classList.toggle("active", (i === 0 && months === 6) || (i === 1 && months === 12));
  });
  if (globalData) renderTrends(globalData.superfeeders, 'super-trends-content', superTrendPeriod);
}

function initOmDetail(source) {
  const baseData = source === 'hss' ? globalData.hss : globalData.superfeeders;
  const subtabsId = source === 'hss' ? 'om-detail-subtabs' : 'super-om-detail-subtabs';
  const subtabs = document.getElementById(subtabsId);
  if (!subtabs) return;
  
  const oms = baseData.oms;
  if (!oms || oms.length === 0) {
    subtabs.innerHTML = '';
    const contentId = source === 'hss' ? 'om-detail-content' : 'super-om-detail-content';
    document.getElementById(contentId).innerHTML = 
      '<div class="data-card"><p style="color: var(--muted);">No OM data available.</p></div>';
    return;
  }
  
  subtabs.innerHTML = oms.map(om => 
    '<button class="sub-tab" onclick="selectOmDetail(\'' + source + '\', \'' + esc(om).replace(/'/g, "\\'") + '\')">' + esc(om) + '</button>'
  ).join('');
  
  if (!omDetailState[source].selectedOm || !oms.includes(omDetailState[source].selectedOm)) {
    omDetailState[source].selectedOm = oms[0];
  }
  selectOmDetail(source, omDetailState[source].selectedOm);
}

function selectOmDetail(source, om) {
  omDetailState[source].selectedOm = om;
  const subtabsId = source === 'hss' ? 'om-detail-subtabs' : 'super-om-detail-subtabs';
  document.querySelectorAll('#' + subtabsId + ' .sub-tab').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === om);
  });
  renderOmDetailContent(source, om);
}

function setOmDetailPeriod(source, months) {
  omDetailState[source].period = months;
  renderOmDetailContent(source, omDetailState[source].selectedOm);
}

function renderOmDetailContent(source, om) {
  const baseData = source === 'hss' ? globalData.hss : globalData.superfeeders;
  const contentId = source === 'hss' ? 'om-detail-content' : 'super-om-detail-content';
  const container = document.getElementById(contentId);
  const period = omDetailState[source].period;
  const months = globalData.months.slice(-period);
  const currentMonth = globalData.current_month;
  const previousMonth = globalData.previous_month;
  const omData = baseData.data[om];
  
  if (!omData) {
    container.innerHTML = '<div class="data-card"><p style="color: var(--muted);">No data for ' + esc(om) + '</p></div>';
    return;
  }
  
  // === Calculate KPI values ===
  let omCurrentPublishedLV = 0;
  let omCurrentPublishedCount = 0;
  let totalCurrentPublishedLV = 0;
  baseData.oms.forEach(o => {
    const d = baseData.data[o]?.currentMonth["Published"];
    if (d) {
      totalCurrentPublishedLV += d.lv || 0;
      if (o === om) {
        omCurrentPublishedLV = d.lv || 0;
        omCurrentPublishedCount = d.count || 0;
      }
    }
  });
  const currentSharePct = totalCurrentPublishedLV > 0 
    ? Math.round((omCurrentPublishedLV / totalCurrentPublishedLV) * 100) : 0;
  
  let omPreviousLV = 0;
  let totalPreviousLV = 0;
  (baseData.quota_previous || []).forEach(client => {
    totalPreviousLV += client.total || 0;
    omPreviousLV += client.oms[om] || 0;
  });
  const previousSharePct = totalPreviousLV > 0 
    ? Math.round((omPreviousLV / totalPreviousLV) * 100) : 0;
  
  const negData = omData.currentMonth["Negotiation"] || { count: 0, lv: 0 };
  const crData = omData.currentMonth["Content Requested"] || { count: 0, lv: 0 };
  
  // Recent 3 months (latest) vs previous 3 months for trend comparison
  const recentMonths = months.slice(-3);
  const prevMonths = months.length >= 6 ? months.slice(-6, -3) : months.slice(0, Math.max(0, months.length - 3));
  
  function calcAvg(mths, metric) {
    let sum = 0, cnt = 0;
    mths.forEach(m => {
      const v = omData.trends[m]?.[metric] || 0;
      if (v > 0) { sum += v; cnt++; }
    });
    return cnt > 0 ? Math.round(sum / cnt) : 0;
  }
  
  const avgDaysToCr    = calcAvg(recentMonths, 'avg_days_to_cr');
  const avgCreatedCr   = calcAvg(recentMonths, 'created_to_cr_rate');
  const avgFeePerLink  = calcAvg(recentMonths, 'avg_fee_per_link');
  
  const prevAvgDaysToCr  = calcAvg(prevMonths, 'avg_days_to_cr');
  const prevAvgCreatedCr = calcAvg(prevMonths, 'created_to_cr_rate');
  const prevAvgFeePerLink = calcAvg(prevMonths, 'avg_fee_per_link');
  
  // trend badge: direction, delta, higherIsBetter
  function trendBadge(current, prev, higherIsBetter, unit) {
    if (prev === 0 || current === 0) return '<span class="kpi-trend neutral">— no prior data</span>';
    const delta = current - prev;
    if (delta === 0) return '<span class="kpi-trend neutral">→ no change</span>';
    const isUp = delta > 0;
    const isGood = higherIsBetter ? isUp : !isUp;
    const cls = isGood ? (isUp ? 'up-good' : 'down-good') : (isUp ? 'up-bad' : 'down-bad');
    const arrow = isUp ? '↑' : '↓';
    const absDelta = Math.abs(delta);
    const deltaStr = unit === '%' ? absDelta + '%' : (unit === 'days' ? absDelta + ' days' : (unit === '$' ? '$' + fmt(absDelta) : String(absDelta)));
    return '<span class="kpi-trend ' + cls + '">' + arrow + ' ' + deltaStr + ' vs prev 3m</span>';
  }
  
  // === Build HTML ===
  let html = '';
  
  // Header
  html += '<div class="om-header">';
  html += '<h2>' + esc(om) + '</h2>';
  html += '<span class="om-meta">' + currentMonth + ' · individual performance view</span>';
  html += '</div>';
  
  // KPI Cards
  html += '<div class="kpi-grid">';
  html += '<div class="kpi-card accent-teal">' +
    '<div class="kpi-label">Published LV · ' + esc(currentMonth) + '</div>' +
    '<div class="kpi-value">' + fmt(omCurrentPublishedLV) + '</div>' +
    '<div class="kpi-sub">' + fmt(omCurrentPublishedCount) + ' records · <strong>' + currentSharePct + '%</strong> of team total</div>' +
    '</div>';
  html += '<div class="kpi-card accent-purple">' +
    '<div class="kpi-label">Published LV · ' + esc(previousMonth) + '</div>' +
    '<div class="kpi-value">' + fmt(omPreviousLV) + '</div>' +
    '<div class="kpi-sub"><strong>' + previousSharePct + '%</strong> of total client quota</div>' +
    '</div>';
  html += '<div class="kpi-card accent-amber">' +
    '<div class="kpi-label">In Negotiation · ' + esc(currentMonth) + '</div>' +
    '<div class="kpi-value">' + fmt(negData.count) + '</div>' +
    '<div class="kpi-sub">LV: ' + fmt(negData.lv) + '</div>' +
    '</div>';
  html += '<div class="kpi-card accent-orange">' +
    '<div class="kpi-label">Content Requested · ' + esc(currentMonth) + '</div>' +
    '<div class="kpi-value">' + fmt(crData.count) + '</div>' +
    '<div class="kpi-sub">LV: ' + fmt(crData.lv) + '</div>' +
    '</div>';
  html += '<div class="kpi-card accent-red">' +
    '<div class="kpi-label">Avg Days Created → Content Requested</div>' +
    '<div class="kpi-value">' + avgDaysToCr + (avgDaysToCr > 0 ? '<span style="font-size:16px;font-weight:400;color:var(--muted);"> days</span>' : '') + '</div>' +
    '<div class="kpi-sub">avg last 3 months</div>' +
    trendBadge(avgDaysToCr, prevAvgDaysToCr, false, 'days') +
    '<div class="kpi-trend-label">lower is better · trend vs previous 3m</div>' +
    '</div>';
  html += '<div class="kpi-card accent-purple">' +
    '<div class="kpi-label">Avg Sponsored Fee per Published Link</div>' +
    '<div class="kpi-value">' + (avgFeePerLink > 0 ? '$' + fmt(avgFeePerLink) : '—') + '</div>' +
    '<div class="kpi-sub">avg last 3 months · only links with FINAL $ filled</div>' +
    trendBadge(avgFeePerLink, prevAvgFeePerLink, false, '$') +
    '<div class="kpi-trend-label">lower = better negotiation · trend vs previous 3m</div>' +
    '</div>';
  html += '</div>';
  
  // 1. Statuses table for this OM
  html += '<div class="data-card"><div class="card-header">Statuses - ' + esc(currentMonth) + '</div>';
  html += '<table class="data-table"><thead><tr><th>Status</th><th class="num">Count</th><th class="num">LV</th></tr></thead><tbody>';
  const statusClasses = {
    "Published": "status-row-published",
    "Pending": "status-row-pending",
    "Content Requested": "status-row-content-requested",
    "Ready for Delivery": "status-row-ready",
    "Revisions Requested": "status-row-revisions",
    "Site Approved": "status-row-approved"
  };
  let tc = 0, tl = 0;
  globalData.statuses.forEach(status => {
    const rowClass = statusClasses[status] || '';
    const d = omData.currentMonth[status] || { count: 0, lv: 0 };
    tc += d.count; tl += d.lv;
    html += '<tr class="' + rowClass + '"><td class="om-name">' + esc(status) + '</td>' +
      '<td class="num">' + fmt(d.count) + '</td>' +
      '<td class="num">' + fmt(d.lv) + '</td></tr>';
  });
  html += '<tr><td class="om-name"><strong>Total</strong></td>' +
    '<td class="num"><strong>' + fmt(tc) + '</strong></td>' +
    '<td class="num"><strong>' + fmt(tl) + '</strong></td></tr>';
  html += '</tbody></table></div>';
  
  // 2. Built Quota - clients this OM contributed to (previous month)
  const clientRows = (baseData.quota_previous || [])
    .filter(c => (c.oms[om] || 0) > 0)
    .map(c => ({
      client: c.client,
      omLv: c.oms[om] || 0,
      total: c.total,
      pct: c.total > 0 ? Math.round(((c.oms[om] || 0) / c.total) * 100) : 0
    }))
    .sort((a, b) => b.omLv - a.omLv);
  
  html += '<div class="data-card"><div class="card-header">Built Quota - ' + esc(previousMonth) + ' · Clients contributed to</div>';
  if (clientRows.length === 0) {
    html += '<p style="color: var(--muted); padding: 1rem 0;">No published records for ' + esc(previousMonth) + '.</p>';
  } else {
    html += '<table class="data-table"><thead><tr><th>Client</th><th class="num">' + esc(om) + ' LV</th><th class="num">Client Total LV</th><th class="num">Share</th></tr></thead><tbody>';
    clientRows.forEach(r => {
      html += '<tr><td class="om-name">' + esc(r.client) + '</td>' +
        '<td class="num">' + fmt(r.omLv) + '</td>' +
        '<td class="num">' + fmt(r.total) + '</td>' +
        '<td class="num">' + r.pct + '%</td></tr>';
    });
    const totalOmLv = clientRows.reduce((s, r) => s + r.omLv, 0);
    html += '<tr><td class="om-name"><strong>Total</strong></td>' +
      '<td class="num"><strong>' + fmt(totalOmLv) + '</strong></td>' +
      '<td class="num"><strong>' + fmt(totalPreviousLV) + '</strong></td>' +
      '<td class="num"><strong>' + previousSharePct + '%</strong></td></tr>';
    html += '</tbody></table>';
    
    // Pie chart: OM vs rest of team
    const pieId = 'chart-om-share-' + source;
    html += '<div class="chart-container chart-small" style="margin-top: 1.5rem;"><canvas id="' + pieId + '"></canvas></div>';
  }
  html += '</div>';
  
  // 3. Trends (toggle + charts)
  html += '<h2 class="section-title">Trends</h2>';
  html += '<div class="toggle-group">' +
    '<button class="toggle-btn ' + (period === 6 ? 'active' : '') + '" onclick="setOmDetailPeriod(\'' + source + '\', 6)">6 Months</button>' +
    '<button class="toggle-btn ' + (period === 12 ? 'active' : '') + '" onclick="setOmDetailPeriod(\'' + source + '\', 12)">12 Months</button>' +
    '</div>';
  
  const trendDefs = [
    { metric: 'total_count', label: 'Total Records per Month', format: 'int' },
    { metric: 'total_lv', label: 'Total LV per Month', format: 'int' },
    { metric: 'created_to_cr_rate', label: 'Created → Content Requested Conversion Rate (%)', format: 'pct' },
    { metric: 'avg_days_to_cr', label: 'Average Days to Content Request', format: 'days' },
    { metric: 'total_cost', label: 'Total Cost of Published Links (USD)', format: 'usd' },
    { metric: 'avg_fee_per_link', label: 'Average Sponsored Fee per Published Link (USD)', format: 'usd' }
  ];
  
  trendDefs.forEach((def, idx) => {
    const chartId = 'chart-omdet-' + source + '-' + idx;
    html += '<div class="data-card"><div class="card-header">' + def.label + '</div>';
    html += '<div class="chart-container"><canvas id="' + chartId + '"></canvas></div>';
    html += '<table class="data-table"><thead><tr><th>Month</th><th class="num">' + esc(om) + '</th></tr></thead><tbody>';
    months.forEach(month => {
      const v = omData.trends[month]?.[def.metric] || 0;
      let display = '-';
      if (v > 0) {
        if (def.format === 'pct') display = v + '%';
        else if (def.format === 'days') display = v + ' days';
        else if (def.format === 'usd') display = '$' + fmt(v);
        else display = fmt(v);
      }
      html += '<tr><td class="om-name">' + esc(month) + '</td><td class="num">' + display + '</td></tr>';
    });
    html += '</tbody></table></div>';
  });
  
  container.innerHTML = html;
  
  // Render pie chart (OM vs rest)
  if (clientRows.length > 0) {
    const pieId = 'chart-om-share-' + source;
    const ctx = document.getElementById(pieId);
    if (ctx) {
      if (charts[pieId]) charts[pieId].destroy();
      const rest = Math.max(0, totalPreviousLV - omPreviousLV);
      charts[pieId] = new Chart(ctx, {

        data: {
          labels: [om, 'Rest of team'],
          datasets: [{
            data: [omPreviousLV, rest],
            backgroundColor: ['#5b4de0', '#eeecea'],
            borderWidth: 2,
            borderColor: '#fff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'right' },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const value = fmt(context.parsed);
                  const total = context.dataset.data.reduce((a, b) => a + b, 0);
                  const pct = total > 0 ? Math.round((context.parsed / total) * 100) : 0;
                  return context.label + ': ' + value + ' (' + pct + '%)';
                }
              }
            }
          }
        }
      });
    }
  }
  
  // Render single-line trend charts
  trendDefs.forEach((def, idx) => {
    const chartId = 'chart-omdet-' + source + '-' + idx;
    const ctx = document.getElementById(chartId);
    if (!ctx) return;
    if (charts[chartId]) charts[chartId].destroy();
    
    charts[chartId] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: months,
        datasets: [{
          label: om,
          data: months.map(m => omData.trends[m]?.[def.metric] || 0),
          borderColor: '#5b4de0',
          backgroundColor: 'rgba(91, 77, 224, 0.12)',
          borderWidth: 2.5,
          tension: 0.3,
          fill: true,
          pointRadius: 4,
          pointBackgroundColor: '#5b4de0'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(ctx) {
                const v = ctx.parsed.y;
                if (def.format === 'pct') return om + ': ' + v + '%';
                if (def.format === 'days') return om + ': ' + v + ' days';
                return om + ': ' + fmt(v);
              }
            }
          }
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  });
}

async function loadData() {
  const btn = document.getElementById("refresh-btn");
  const loadScreen = document.getElementById("loading-screen");
  const dash = document.getElementById("dashboard");

  btn.classList.add("loading");
  document.getElementById("load-text").textContent = "Loading data...";

  try {
    const res = await fetch("/api/data");
    if (!res.ok) throw new Error("API error " + res.status);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Unknown error");

    globalData = json;
    const loaded = new Date(json.generated).toLocaleTimeString("en-US");
    document.getElementById("nav-meta").textContent = 
      json.current_month + " - loaded " + loaded;

    renderStatuses(json.hss, 'statuses-content');
    renderQuota(json.hss, 'quota-content', json.previous_month);
    renderTrends(json.hss, 'trends-content');
    initOmDetail('hss');
    
    renderStatuses(json.superfeeders, 'super-statuses-content');
    renderQuota(json.superfeeders, 'super-quota-content', json.previous_month);
    renderTrends(json.superfeeders, 'super-trends-content', superTrendPeriod);
    initOmDetail('super');

    loadScreen.style.display = "none";
    dash.style.display = "block";

  } catch(err) {
    document.getElementById("load-text").textContent = "Error: " + err.message;
    loadScreen.innerHTML =
      '<div class="load-wordmark">SearchTides</div>' +
      '<h1 class="load-title">OM <em>PERFORMANCE</em></h1>' +
      '<div class="error-box">' +
        '<h3>Could not load data</h3>' +
        '<p>' + esc(err.message) + '</p>' +
        '<button class="retry-btn" onclick="loadData()">Retry</button>' +
      '</div>';
  } finally {
    btn.classList.remove("loading");
  }
}

  const currentMonth = globalData.current_month;
  
  // Status to CSS class mapping
  const statusClasses = {
    "Published": "status-row-published",
    "Pending": "status-row-pending",
    "Content Requested": "status-row-content-requested",
    "Ready for Delivery": "status-row-ready",
    "Revisions Requested": "status-row-revisions",
    "Site Approved": "status-row-approved"
  };
  
  // Build count table
  let countHtml = '<div class="data-card"><div class="card-header">Record Counts by Status - ' + currentMonth + '</div>';
  countHtml += '<table class="data-table"><thead><tr><th>Status</th>';
  oms.forEach(om => {
    countHtml += '<th class="num">' + esc(om) + '</th>';
  });
  countHtml += '<th class="num">Total</th></tr></thead><tbody>';
  
  statuses.forEach(status => {
    const rowClass = statusClasses[status] || '';
    countHtml += '<tr class="' + rowClass + '"><td class="om-name">' + esc(status) + '</td>';

    oms.forEach(om => {

  let lvHtml = '<div class="data-card"><div class="card-header">LV Values by Status - ' + currentMonth + '</div>';
  lvHtml += '<table class="data-table"><thead><tr><th>Status</th>';
  oms.forEach(om => {
    lvHtml += '<th class="num">' + esc(om) + '</th>';
  });
  lvHtml += '<th class="num">Total</th></tr></thead><tbody>';
  
  statuses.forEach(status => {
    const rowClass = statusClasses[status] || '';
    lvHtml += '<tr class="' + rowClass + '"><td class="om-name">' + esc(status) + '</td>';
    let rowTotal = 0;
    oms.forEach(om => {
      const data = baseData.data[om]?.currentMonth[status];
      const lv = data?.lv || 0;
      rowTotal += lv;
      lvHtml += '<td class="num">' + fmt(lv) + '</td>';
    });
    lvHtml += '<td class="num"><strong>' + fmt(rowTotal) + '</strong></td></tr>';
  });

function renderQuota(baseData, containerId, previousMonth) {
  const container = document.getElementById(containerId);
  const quotaData = baseData.quota_previous;
  const oms = baseData.oms;
  
  if (!quotaData || quotaData.length === 0) {
    container.innerHTML = '<div class="data-card"><p style="color: var(--muted);">No published data for ' + previousMonth + '</p></div>';
    return;
  }
  
  // Table
  let html = '<div class="data-card"><div class="card-header">Published LV by Client (' + previousMonth + ')</div>';
  html += '<table class="data-table"><thead><tr><th>Client</th>';
  oms.forEach(om => {
    html += '<th class="num">' + esc(om) + '</th>';
  });
  html += '<th class="num">Total</th></tr></thead><tbody>';
  
  quotaData.forEach(client => {
    html += '<tr><td class="om-name">' + esc(client.client) + '</td>';
    oms.forEach(om => {
      const val = client.oms[om] || 0;
      html += '<td class="num">' + (val > 0 ? fmt(val) : '-') + '</td>';
    });
    html += '<td class="num"><strong>' + fmt(client.total) + '</strong></td></tr>';
  });
  html += '</tbody></table></div>';
  
  // Pie chart for OM contributions
  const omTotals = {};
  oms.forEach(om => { omTotals[om] = 0; });
  quotaData.forEach(client => {
    oms.forEach(om => {
      omTotals[om] += (client.oms[om] || 0);
    });
  });
  
  const chartId = 'chart-' + containerId;
  html += '<div class="data-card"><div class="card-header">OM Contribution Distribution</div>';
  html += '<div class="chart-container chart-small"><canvas id="' + chartId + '"></canvas></div></div>';
  
  container.innerHTML = html;
  
  // Render pie chart
  const ctx = document.getElementById(chartId);
  if (charts[chartId]) charts[chartId].destroy();
  charts[chartId] = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: oms,
      datasets: [{
        data: oms.map(om => omTotals[om]),
        backgroundColor: CHART_COLORS,
        borderWidth: 2,
        borderColor: '#fff'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right' },
        tooltip: {
          callbacks: {
            label: function(context) {
              const label = context.label || '';
              const value = fmt(context.parsed);
              const total = context.dataset.data.reduce((a, b) => a + b, 0);
              const pct = total > 0 ? Math.round((context.parsed / total) * 100) : 0;
              return label + ': ' + value + ' (' + pct + '%)';
            }
          }
        }
      }
    }
  });
}

  html += '</tr></thead><tbody>';
  
  months.forEach(month => {
    html += '<tr><td class="om-name">' + esc(month) + '</td>';
    oms.forEach(om => {
      const val = baseData.data[om]?.trends[month]?.avg_fee_per_link || 0;
      html += '<td class="num">' + (val > 0 ? '$' + fmt(val) : '-') + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  
  container.innerHTML = html;
  
  // Render all charts
  renderLineChart(chartId1, months, oms, baseData, 'total_count');
  renderLineChart(chartId2, months, oms, baseData, 'total_lv');
  renderLineChart(chartId3, months, oms, baseData, 'created_to_cr_rate');
  renderLineChart(chartId4, months, oms, baseData, 'avg_days_to_cr');
  renderLineChart(chartId5, months, oms, baseData, 'total_cost');
  renderLineChart(chartId6, months, oms, baseData, 'avg_fee_per_link');
}

function renderLineChart(chartId, months, oms, baseData, metric) {
  const ctx = document.getElementById(chartId);
  if (!ctx) return;
  
  if (charts[chartId]) charts[chartId].destroy();
  
  const datasets = oms.map((om, idx) => ({
    label: om,
    data: months.map(month => baseData.data[om]?.trends[month]?.[metric] || 0),
    borderColor: CHART_COLORS[idx % CHART_COLORS.length],
    backgroundColor: CHART_COLORS[idx % CHART_COLORS.length] + '20',
    borderWidth: 2,
    tension: 0.3,
    fill: false
  }));
  
  charts[chartId] = new Chart(ctx, {
    type: 'line',
    data: { labels: months, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top' },
        tooltip: { mode: 'index', intersect: false }
      },
      scales: {
        y: { beginAtZero: true }
      }
    }
  });
}

loadData();
</script>
